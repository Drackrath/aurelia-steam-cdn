[package]
name = "aurelia-steam-cdn"
version = "5.3.0"
edition = "2024"
rust-version = "1.100"
description = "Steam CDN client (Aurelia fork of steam-cdn, built on aurelia-steam-vent 0.8)"
license = "GPL-3.0-or-later"
repository = "https://github.com/Drackrath/aurelia-steam-cdn"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "fs", "macros"] }
futures = "0.3"
steam-vent = { package = "aurelia-steam-vent", version = "0.8.0" }
steam-vent-proto = { package = "aurelia-steam-vent-proto", version = "0.6.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyvalues-parser = "0.2.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
thiserror = "2.0"
tracing = "0.1"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] } # Deflate only: Steam zips nothing else.
itertools = "0.15"
crc32fast = "1.4"
bytes = "1.9"
base64 = "0.23"
aes = "0.9"
cbc = "0.2"
sha1 = "0.11"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "optimization"] } # Decodes Steam's VZ chunk containers.
ruzstd = "0.9.1" # Decodes Steam's VSZ chunk containers.

[dev-dependencies]
# Builds VZ payloads for round-trip tests.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder"] }
