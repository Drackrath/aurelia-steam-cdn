[package]
name = "aurelia-steam-cdn"
version = "3.2.0"
edition = "2024"
description = "Steam CDN client (Aurelia fork of steam-cdn, built on aurelia-steam-vent 0.7)"
license = "GPL-3.0-or-later"
repository = "https://github.com/Drackrath/aurelia-steam-cdn"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "fs", "macros"] }
futures = "0.3"
steam-vent = { package = "aurelia-steam-vent", version = "0.7.0" }
steam-vent-proto = "=0.5.2"
serde = { version = "1.0", features = ["derive"] }
keyvalues-parser = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
thiserror = "2.0"
tracing = "0.1"
zip = "2.2.2"
itertools = "0.14"
crc32fast = "1.4"
bytes = "1.9"
base64 = "0.22"
protobuf = "3.5"
aes = "0.8"
cbc = "0.1"
sha1 = "0.10"
lzma-rs = { version = "0.3", features = ["raw_decoder"] }
ruzstd = "0.7" # Decodes Steam's VSZ chunk containers.
